﻿﻿<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Mūzika | Puteklis</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta property="og:title" content="Putekļa radio" />
  <meta property="og:description" content="Latvijas neatkarīgā mūzika — Puteklis" />
  <meta property="og:image" content="https://puteklis.com/images/share/muzika.jpg" />
  <meta property="og:url" content="https://puteklis.com/muzika.html" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="assets/css/main_puteklis.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body{margin:0;font-family:'Helvetica Neue',sans-serif;background:#121212;color:#f8f8f8}
    header{background:#1f1f1f;text-align:center;padding:1rem 0}
    header nav a{color:#f8f8f8;margin:0 1rem;text-decoration:none;font-weight:bold}
    header nav a.active{text-decoration:underline}
    .container{max-width:1100px;margin:auto;padding:2rem}

    /* Populārie stilu taustiņi */
    #popularStyles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:1rem}
    .style-btn{background:#444;border:none;color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.9em}
    .style-btn:hover{background:#666}

    /* Filtrs + meklētājs */
    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}
    select,input[type='search']{background:#222;border:1px solid #444;color:#eee;border-radius:6px;padding:10px;min-width:220px}

    /* Dziesmu kartīte */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:25px}
    .card{background:#1e1e1e;border-radius:12px;overflow:visible;display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(0,0,0,.45);transition:transform .3s ease,box-shadow .3s ease}
    .card:hover{transform:scale(1.03);box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:10}
    .card.highlight{outline:2px solid #ee6c4d}
    .card img,.card video{width:100%;height:170px;object-fit:cover;transition:transform .4s ease}
    .card:hover img,.card:hover video{transform:scale(1.06)}
    .card .info{padding:12px;flex:1;display:flex;flex-direction:column;gap:8px;position:relative;overflow:visible}
    .card h4{margin:0;font-size:1.05em}
    .card p{margin:0;color:#bbb;font-size:.85em}
    .desc{position:relative;overflow:hidden;white-space:nowrap;line-height:1.35em;max-width:100%}
    .desc span{display:inline-block;transform:translateX(0);padding-right:40px}
    .card:hover .desc span,.card.playing .desc span{animation: marquee 48s linear infinite}
    @keyframes marquee{
      0%{transform:translateX(0)}
      100%{transform:translateX(-100%)}
    }
    .action-row{display:flex;gap:6px;align-items:stretch}
    .play-btn,.lyrics-btn,.share-btn{border:none;color:#fff;border-radius:8px;padding:10px 8px;cursor:pointer;flex:1 1 0;min-width:0;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;white-space:nowrap;font-size:.88em}
    .share-btn svg{width:20px;height:20px}
    .share-btn{min-width:0}
    .play-btn{background:#ee6c4d;flex:0 0 auto;padding:10px 16px;font-size:1.15em}
    .lyrics-btn{background:#555}
    .share-btn{background:#2c2c2c;border:1px solid #444}
    .play-btn:hover,.lyrics-btn:hover,.share-btn:hover{filter:brightness(1.1)}
    .lyrics-box{display:none;background:#111;color:#ddd;padding:8px;border-radius:6px;font-family:monospace;white-space:pre-wrap;max-height:160px;overflow-y:auto}
    .share-row{display:flex;justify-content:flex-start;margin-top:4px}
    .share-wrap{position:relative;flex:1}
    .share-btn svg{width:16px;height:16px;fill:currentColor}
    .share-menu{position:absolute;top:105%;right:0;background:#1d1d1d;border:1px solid #333;border-radius:10px;padding:8px;display:none;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:50;width:190px}
    .share-menu.open{display:flex}
    .share-menu button{background:#2f2f2f;border:1px solid #444;color:#eee;border-radius:6px;padding:8px;cursor:pointer;text-align:left;font-weight:600}
    .share-menu button:hover{background:#3a3a3a}
    .share-note{font-size:.8em;color:#aaa;margin-top:6px}
    .like-btn{background:#2c2c2c;border:1px solid #444;color:#aaa;border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:.9em;transition:color .2s,border-color .2s,background .2s;white-space:nowrap;flex:0 0 auto}
    .like-btn:hover{border-color:#e74c3c;color:#e74c3c}
    .like-btn.liked{color:#e74c3c;border-color:#e74c3c;background:#2c1a1a}
    .like-btn:disabled{opacity:.5;cursor:default}
    .like-heart{font-size:1.05em;line-height:1}
    .like-count{font-size:.85em;font-weight:600}

    /* Pielikšanas popup */
    .sb-add-btn{background:#2c2c2c;border:1px solid #444;color:#aaa;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:1.1em;font-weight:700;transition:color .2s,border-color .2s;flex:0 0 auto;line-height:1}
    .sb-add-btn:hover{border-color:#4ba3ff;color:#4ba3ff}
    .sb-add-popup{position:absolute;bottom:calc(100% + 6px);right:0;background:#1d1d1d;border:1px solid #333;border-radius:10px;padding:8px;z-index:200;min-width:180px;box-shadow:0 6px 20px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:4px}
    .sb-pop-item{background:#2f2f2f;border:1px solid #444;color:#eee;border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;font-size:.9em;width:100%}
    .sb-pop-item:hover{background:#3a3a3a}
    .sb-pop-empty{color:#aaa;font-size:.85em;padding:6px;text-align:center}

    /* Playlist sānjosla */
    .sb-sidebar{position:fixed;top:0;right:0;width:300px;height:100vh;background:#1a1a1a;border-left:1px solid #333;z-index:3000;display:flex;flex-direction:column;transition:transform .3s ease;box-shadow:-4px 0 20px rgba(0,0,0,.6)}
    .sb-sidebar.sb-closed{transform:translateX(100%)}
    .sb-top{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #333;background:#111}
    .sb-top h3{margin:0;font-size:1em;color:#fff}
    .sb-close-btn{background:none;border:none;color:#aaa;font-size:1.5em;cursor:pointer;line-height:1;padding:0}
    .sb-close-btn:hover{color:#fff}
    .sb-inner{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

    /* Login form */
    #sb-login{display:flex;flex-direction:column;gap:8px}
    .sb-google-btn{background:#fff;color:#333;border:none;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:.9em}
    .sb-google-btn:hover{background:#f0f0f0}
    .sb-divider{text-align:center;color:#555;font-size:.8em;margin:4px 0}
    #sb-email,#sb-pass{background:#2c2c2c;border:1px solid #444;color:#eee;border-radius:8px;padding:10px;width:100%;box-sizing:border-box;font-size:.9em}
    .sb-btn{background:#4ba3ff;border:none;color:#fff;border-radius:8px;padding:10px;cursor:pointer;font-weight:700;font-size:.9em;width:100%}
    .sb-btn:hover{background:#3a92ee}
    .sb-btn-link{background:none;border:none;color:#aaa;cursor:pointer;font-size:.82em;text-decoration:underline;text-align:left;padding:0}
    .sb-btn-link:hover{color:#fff}
    #sb-auth-msg{font-size:.82em;min-height:1.2em}

    /* User bar */
    #sb-user{display:none;align-items:center;justify-content:space-between;gap:8px;background:#2a2a2a;border-radius:8px;padding:10px}
    #sb-user-email{font-size:.8em;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

    /* Playlist section */
    #sb-playlists{display:none}
    .sb-new-pl{display:flex;gap:6px}
    #sb-new-pl-name{background:#2c2c2c;border:1px solid #444;color:#eee;border-radius:8px;padding:8px;flex:1;font-size:.9em}
    .sb-icon-btn{background:#2c2c2c;border:1px solid #444;color:#ccc;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:.85em;line-height:1}
    .sb-icon-btn:hover{background:#3a3a3a;color:#fff}
    .sb-del-btn:hover{border-color:#e74c3c;color:#e74c3c}
    .sb-pl-item{background:#222;border-radius:8px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .2s}
    .sb-pl-item:hover{background:#2a2a2a}
    .sb-pl-name{flex:1;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sb-pl-btns{display:flex;gap:4px;flex-shrink:0}
    .sb-empty{color:#666;font-size:.85em;text-align:center;margin:12px 0}

    /* Detail view */
    .sb-detail-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .sb-back-btn{background:none;border:none;color:#aaa;font-size:1.2em;cursor:pointer;padding:0}
    .sb-back-btn:hover{color:#fff}
    .sb-detail-header h4{flex:1;margin:0;font-size:.95em}
    .sb-detail-song{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #2a2a2a}
    .sb-song-num{color:#555;font-size:.8em;width:18px;text-align:right;flex-shrink:0}
    .sb-song-title{flex:1;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Sidebar toggle */
    .sb-toggle-btn{position:fixed;right:0;top:50%;transform:translateY(-50%);background:#1a1a1a;border:1px solid #333;border-right:none;color:#aaa;cursor:pointer;padding:12px 8px;border-radius:8px 0 0 8px;z-index:2999;font-size:1.1em;line-height:1;transition:background .2s,color .2s}
    .sb-toggle-btn:hover{background:#2a2a2a;color:#fff}
    @media(max-width:600px){.sb-sidebar{width:100%}}

    /* Playlist mode josla */
    #pl-mode-bar{display:none;background:#1a3a1a;border-bottom:2px solid #1db954;padding:8px 20px;text-align:center;font-size:.88em;gap:12px;align-items:center;justify-content:center}
    #pl-mode-bar.visible{display:flex}

     /* Mini‑player */
    #playerBar{position:fixed;bottom:0;left:0;right:0;background:#181818;display:flex;align-items:center;gap:15px;padding:10px 20px;box-shadow:0 -2px 10px rgba(0,0,0,.6);z-index:2000}
    #playerBar img{width:48px;height:48px;object-fit:cover;border-radius:4px}
    #trackMeta{flex:1;min-width:0}
    #trackMeta h5{margin:0;font-size:.95em}
    #trackMeta span{font-size:.8em;color:#aaa}
    .player-btn{background:linear-gradient(180deg,#6ec5ff,#228dff);border:none;color:#fff;font-size:1.35em;cursor:pointer;border-radius:6px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:filter .2s}
    .player-btn:hover{filter:brightness(1.15)}
    .player-btn:disabled{opacity:.3;cursor:default}
    .player-btn.active{background:#1db954}
    #progressWrap{flex:2;display:flex;align-items:center;gap:8px}
    #progress{flex:1;height:4px;background:#444;border-radius:2px;cursor:pointer}
    #progressFill{height:100%;background:#1db954;border-radius:2px;width:0}
    #timestamp{width:60px;font-size:.75em;text-align:right}
    @media(max-width:600px){#playerBar img{display:none}#progressWrap{display:none}}
  </style>
</head>

<header>
  <nav>
    <a href="index.html">Manifests</a>
    <a href="maksla.html">Māksla</a>
    <a href="muzika.html" class="active">Mūzika</a>
  </nav>
</header>

<!-- Playlist režīma josla -->
<div id="pl-mode-bar">
  <span id="pl-mode-name">Saraksts</span>
  <button onclick="exitPlaylistMode()" style="background:#c0392b;border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.85em">✕ Iziet</button>
</div>

<!-- Sānjosla -->
<aside id="playlist-sidebar" class="sb-sidebar sb-closed">
  <div class="sb-top">
    <h3>📋 Mani saraksti</h3>
    <button class="sb-close-btn" onclick="closeSidebar()">×</button>
  </div>
  <div class="sb-inner">
    <!-- Login -->
    <div id="sb-login">
      <button class="sb-google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Ielogoties ar Google
      </button>
      <div class="sb-divider">vai ar e-pastu</div>
      <input type="email" id="sb-email" placeholder="E-pasts" autocomplete="email">
      <input type="password" id="sb-pass" placeholder="Parole" autocomplete="current-password">
      <button class="sb-btn" onclick="signInWithEmail()">Ielogoties</button>
      <button class="sb-btn-link" onclick="signUpWithEmail()">Reģistrēties</button>
      <div id="sb-auth-msg"></div>
    </div>

    <!-- Ielogojies -->
    <div id="sb-user">
      <span id="sb-user-email"></span>
      <button class="sb-btn-link" onclick="signOut()">Iziet</button>
    </div>

    <!-- Saraksti -->
    <div id="sb-playlists">
      <div id="sb-pl-list-view">
        <div class="sb-new-pl">
          <input type="text" id="sb-new-pl-name" placeholder="Jauna saraksta nosaukums">
          <button class="sb-icon-btn" onclick="createNewPlaylist()" title="Izveidot">+</button>
        </div>
        <div id="sb-playlist-list" style="margin-top:10px"></div>
      </div>
      <div id="sb-pl-detail-view" style="display:none">
        <div class="sb-detail-header">
          <button class="sb-back-btn" onclick="closePlaylistDetail()">←</button>
          <h4 id="sb-detail-name"></h4>
          <button class="sb-icon-btn" onclick="if(activePl) playPlaylist(activePl.id)" title="Atskaņot visu">▶</button>
        </div>
        <div id="sb-detail-songs"></div>
      </div>
    </div>
  </div>
</aside>

<!-- Sānjoslas toggle -->
<button class="sb-toggle-btn" onclick="toggleSidebar()" title="Mani saraksti">📋</button>

<div class="container">
  <h1 style="text-align:center;margin-bottom:1rem">🎧 Putekļa radio</h1>

  <div id="popularStyles"></div>

  <div class="controls">
    <select id="styleSel"><option value="">-- Visi stili --</option></select>
    <input type="search" id="search" placeholder="Meklē nosaukumu, stilu">
  </div>

  <div class="grid" id="songGrid">Notiek ielāde...</div>
</div>

<!-- Sticky player -->
<div id="playerBar" style="display:none">
  <img id="coverMini" src="" alt="">
  <div id="trackMeta"><h5 id="trackTitle">—</h5><span id="trackStyle">—</span></div>
  <button id="shuffleBtn" class="player-btn" title="Shuffle">🔀</button>
  <button id="prevBtn" class="player-btn">⏮️</button>
  <button id="playPauseBtn" class="player-btn">▶️</button>
  <button id="nextBtn" class="player-btn">⏭️</button>
  <div id="progressWrap"><div id="progress"><div id="progressFill"></div></div><div id="timestamp">0:00</div></div>
</div>

<script>
/* ---------- Helper ---------- */
const qs = s => document.querySelector(s);
const cssSafe = s => s.replace(/[^a-z0-9]/gi,'_');
const fmt = t => { t = Math.floor(t); return Math.floor(t/60) + ':' + ('0' + t % 60).slice(-2); };

/* ---------- Elements ---------- */
const grid = qs('#songGrid'), sel = qs('#styleSel'), inp = qs('#search'), pop = qs('#popularStyles');
const audio = new Audio(), bar = qs('#playerBar'), coverMini = qs('#coverMini');
const trackTitle = qs('#trackTitle'), trackStyle = qs('#trackStyle');
const playPauseBtn = qs('#playPauseBtn'), prevBtn = qs('#prevBtn'), nextBtn = qs('#nextBtn'), shuffleBtn = qs('#shuffleBtn');
const progress = qs('#progress'), fill = qs('#progressFill'), stamp = qs('#timestamp');

/* ---------- State ---------- */
let songs = []; // tiks piepildīts ar fetch
let list = [];
let current = -1;
let shuffleOn = false;
let focusTrack = new URLSearchParams(window.location.search).get('track');
let focusApplied = false;
const autoplayOnLoad = !!focusTrack;
if(focusTrack) focusTrack = focusTrack.toLowerCase();
const shareMenus = new Set();
document.addEventListener('click', () => closeShareMenus());

/* ---------- Ielādē songs.json ---------- */
async function loadSongs(){
  try{
    const res = await fetch('songs.json');
    songs = await res.json();
    populateSelect();
    filterRender();
  }catch(err){
    console.error(err);
    grid.textContent = '❗ Neizdevās ielādēt dziesmu datus.';
  }
}

function startPlaylistMode(songTitles) {
  list = songs.filter(s => songTitles.includes(s.title));
  list.sort((a,b) => songTitles.indexOf(a.title) - songTitles.indexOf(b.title));
  if(!list.length){ alert('Dziesmas nav atrastas.'); return; }
  grid.innerHTML = '';
  list.forEach((song,i) => grid.appendChild(makeCard(song,i)));
  if(typeof initLikes === 'function') initLikes();
  const bar = document.getElementById('pl-mode-bar');
  const nameEl = document.getElementById('pl-mode-name');
  if(bar){ bar.classList.add('visible'); }
  if(nameEl && activePl){ nameEl.textContent = '▶ ' + activePl.name; }
  playIndex(0);
  closeSidebar();
}

function exitPlaylistMode() {
  document.getElementById('pl-mode-bar')?.classList.remove('visible');
  filterRender();
}

document.addEventListener('DOMContentLoaded', loadSongs);

/* ---------- Populārie stilu taustiņi ---------- */
[['','🎶 visi'],['metal','🤘 metal'],['rock','🎸 rock'],['country','🤠 country'],['blues','🎷 blues'],['jazz','🎺 jazz'],['cabaret','🎭 cabaret'],['darkwave','🌑 darkwave']]
  .forEach(([val,label]) => {
    const b = document.createElement('button');
    b.className = 'style-btn';
    b.dataset.style = val;
    b.textContent = label;
    b.onclick = () => { sel.value = val; filterRender(); };
    pop.appendChild(b);
});

/* ---------- Populate select, kad dati gatavi ---------- */
function populateSelect(){
  sel.innerHTML = '<option value="">-- Visi stili --</option>';
  [...new Set(songs.map(s => s.style.split(',')[0].trim().toLowerCase()))]
    .sort()
    .forEach(st => {
      const o = document.createElement('option');
      o.value = st;
      o.textContent = st;
      sel.appendChild(o);
    });
}

/* ---------- Filtrēšana + renderēšana ---------- */
sel.onchange = inp.oninput = filterRender;
function filterRender(){
  if(!songs.length){ return; }
  const term = inp.value.toLowerCase(), st = sel.value;
  list = songs.filter(s => {
    const okSt = !st || s.style.toLowerCase().startsWith(st);
    const okT = s.title.toLowerCase().includes(term) || s.style.toLowerCase().includes(term);
    return okSt && okT;
  });
  list.reverse(); // newest first
  grid.innerHTML = list.length ? '' : 'Nav atbilstošu dziesmu.';
  list.forEach((song,i) => {
    const card = makeCard(song,i);
    grid.appendChild(card);
    if(focusTrack && !focusApplied && song.title.toLowerCase() === focusTrack){
      card.classList.add('highlight');
      card.scrollIntoView({behavior:'smooth', block:'center'});
      if(autoplayOnLoad) setTimeout(() => playIndex(i), 400);
      focusApplied = true;
    }
  });
  if(typeof initLikes === 'function') initLikes();
}

function makeCard(song,i){
  const c = document.createElement('div');
  c.className = 'card';
  c.dataset.cardIdx = i;
  const cover = song.videoCover ?
    `<video src="${song.videoCover}" muted autoplay loop playsinline></video>` :
    `<img src="${song.image}" alt="">`;
  c.innerHTML = `
    ${cover}
    <div class='info'>
      <h4>${song.title}</h4>
      <p class='desc'><span>${song.style}</span></p>




      <div class='action-row'>
        <button class='play-btn' data-idx='${i}' title='Atskaņot'>▶</button>
        <button class='lyrics-btn'>Vārdi</button>
        <button class='sb-add-btn' data-song-id="${song.title.replace(/"/g,'&quot;')}" title="Pievienot sarakstam">+</button>
        <button class='like-btn' data-song-id="${song.title.replace(/"/g,'&quot;')}">
          <span class='like-heart'>♡</span>
          <span class='like-count'>…</span>
        </button>
        <div class='share-wrap'>
          <button class='share-btn'>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v3H8v4h4v3l6-5-6-5Z" fill="currentColor"/></svg>
            <span>Dalīties</span>
          </button>
          <div class='share-menu'>
            <button class='copy-link'>Kopēt saiti</button>
            <button class='native-share'>Dalīties ar...</button>
          </div>
        </div>
      </div>
      <div class='lyrics-box' id='lyr_${cssSafe(song.title)}'>Ielāde...</div>
    </div>`;
  c.querySelector('.play-btn').onclick = e => playIndex(+e.currentTarget.dataset.idx);
  c.querySelector('.lyrics-btn').onclick = () => toggleLyrics(song);
  if(typeof attachLikeHandler === 'function') attachLikeHandler(c.querySelector('.like-btn'));
  const addBtn = c.querySelector('.sb-add-btn');
  if(addBtn) addBtn.onclick = e => { e.stopPropagation(); if(typeof showAddToPlaylistPopup === 'function') showAddToPlaylistPopup(song.title, addBtn); };
  const shareWrap = c.querySelector('.share-wrap');
  const shareBtn = shareWrap.querySelector('.share-btn');
  const menu = shareWrap.querySelector('.share-menu');
  const copyBtn = menu.querySelector('.copy-link');
  const nativeBtn = menu.querySelector('.native-share');
  shareBtn.onclick = ev => { ev.stopPropagation(); toggleShareMenu(menu, shareBtn); };
  menu.onclick = ev => ev.stopPropagation();
  copyBtn.onclick = ev => { ev.stopPropagation(); closeShareMenus(); copySongLink(song, copyBtn); };
  nativeBtn.onclick = ev => { ev.stopPropagation(); closeShareMenus(); shareNative(song); };
  return c;
}
function toggleLyrics(song){
  const box = qs('#lyr_' + cssSafe(song.title));
  if(!box) return;
  if(box.style.display === 'block') { box.style.display = 'none'; return; }
  if(box.textContent.trim() === 'Ielāde...'){
    fetch(encodeURI(song.lyrics))
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => box.textContent = t)
      .catch(() => box.textContent = 'Teksts nav atrasts');
  }
  box.style.display = 'block';
}


/* ---------- Atskaņotājs ---------- */
function playIndex(i){
  current = i;
  const song = list[i];
  if(!song) return;
  audio.src = song.audio;
  bar.style.display = 'flex';
  coverMini.src = song.image;
  trackTitle.textContent = song.title;
  trackStyle.textContent = song.style.split(',')[0].trim();
  playPauseBtn.textContent = '▶️';
  const p = audio.play();
  if(p instanceof Promise) p.then(() => { playPauseBtn.textContent = '⏸️'; }).catch(() => {});
  else playPauseBtn.textContent = '⏸️';
  updateButtons();
  highlightPlayingCard(i);
}

function updateButtons(){
  prevBtn.disabled = current <= 0;
  nextBtn.disabled = current >= list.length - 1;
  shuffleBtn.classList.toggle('active', shuffleOn);
}

playPauseBtn.onclick = () => {
  if(audio.paused){
    audio.play();
    playPauseBtn.textContent = '⏸️';
  } else {
    audio.pause();
    playPauseBtn.textContent = '▶️';
  }
};
prevBtn.onclick = () => { if(current > 0) playIndex(current - 1); };
nextBtn.onclick = () => playNext();
shuffleBtn.onclick = () => { shuffleOn = !shuffleOn; shuffleBtn.classList.toggle('active', shuffleOn); };

audio.onended = playNext;

function playNext(){
  if(!list.length) return;
  shuffleOn ? playIndex(Math.floor(Math.random()*list.length))
            : (current < list.length - 1 ? playIndex(current + 1) : (playPauseBtn.textContent = '▶️'));
}

audio.ontimeupdate = () => {
  if(audio.duration){
    fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    stamp.textContent = fmt(audio.currentTime);
  }
};

progress.onclick = e => {
  if(!audio.duration) return;
  const r = progress.getBoundingClientRect();
  const pct = (e.clientX - r.left) / r.width;
  audio.currentTime = pct * audio.duration;
};
function highlightPlayingCard(i){
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  const card = document.querySelector(`.card[data-card-idx='${i}']`);
  if(card) card.classList.add('playing');
}



/* ---------- Dalīšana ---------- */
function songSlug(title){
  return title.toLowerCase()
    .replace(/[āàáâä]/g,'a').replace(/[čç]/g,'c').replace(/[ēèéêë]/g,'e')
    .replace(/[ģ]/g,'g').replace(/[īìíîï]/g,'i').replace(/[ķ]/g,'k')
    .replace(/[ļ]/g,'l').replace(/[ņ]/g,'n').replace(/[šß]/g,'s')
    .replace(/[ūùúûü]/g,'u').replace(/[žź]/g,'z')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function songShareUrl(song){
  return window.location.origin + '/share/' + songSlug(song.title) + '/';
}

function toggleShareMenu(menu, trigger){
  const isOpen = !menu.classList.contains('open');
  closeShareMenus();
  if(isOpen){
    menu.classList.add('open');
    positionShareMenu(menu, trigger);
    shareMenus.add(menu);
  }
}
function positionShareMenu(menu, trigger){
  if(!menu) return;
  menu.style.left = '';
  menu.style.right = '0';
  const pad = 8;
  let rect = menu.getBoundingClientRect();
  if(rect.left < pad){
    menu.style.right = 'auto';
    menu.style.left = '0';
    rect = menu.getBoundingClientRect();
  }
  if(rect.right > window.innerWidth - pad){
    menu.style.left = 'auto';
    menu.style.right = '0';
  }
}
function closeShareMenus(leaveOpen){
  [...shareMenus].forEach(m => {
    if(leaveOpen && m === leaveOpen){ return; }
    m.classList.remove('open');
    shareMenus.delete(m);
  });
}

async function copySongLink(song, copyBtn){
  const shareUrl = songShareUrl(song);
  const text = `${shareUrl}`;
  const copyViaTextarea = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  };
  const copyViaPrompt = () => { window.prompt('NoKopēt saiti:', text); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else if(!copyViaTextarea()){
      copyViaPrompt();
      return;
    }
  }catch(err){
    console.warn('Clipboard write failed, trying fallbacks', err);
    if(!copyViaTextarea()){
      copyViaPrompt();
      return;
    }
  }
  if(copyBtn){
    const old = copyBtn.textContent;
    copyBtn.textContent = 'Nokopēts!';
    setTimeout(() => copyBtn.textContent = old, 1400);
  }
}



async function shareNative(song){
  const shareUrl = songShareUrl(song);
  const data = { title: song.title, text: song.title, url: shareUrl };

  if(navigator.share){
    try{
      await navigator.share(data);
      return;
    }catch(err){
      if(err.name !== 'AbortError') console.warn('Native share neizdevās:', err);
      return;
    }
  }

  try{ await copySongLink(song); }catch(err){ console.warn('Copy link failed:', err); }
  alert('Dalīšana nav pieejama. Saite nokopēta!');
}
