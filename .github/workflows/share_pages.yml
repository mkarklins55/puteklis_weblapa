name: Generate Share Pages

on:
  push:
    paths:
      - 'songs.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Generate share pages
        run: node generate_share_pages.js
      - name: Commit share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add share/
          git diff --staged --quiet || git commit -m "Atjauninātas share lapas"
          git push
