<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://www.puteklis.com/avatar_dejo.html">
  <meta charset="UTF-8" />
  <link rel="icon" href="/images/logo_small.png" type="image/png">
  <title>Avatars Dancing with Music</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
    #player-container { display: flex; align-items: center; padding: 10px; background: #222; }
    #song-select { margin-right: 20px; }
    canvas { display: block; width: 100%; height: 600px; }
  </style>
</head>
<body>
  <div id="player-container">
    <select id="song-select"></select>
    <button id="play-btn">Play</button>
  </div>
  <audio id="audio" controls></audio>
  <div id="3d-container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three';
    import { OrbitControls } from 'https://cdn.skypack.dev/three/examples/jsm/controls/OrbitControls.js';
    import { FBXLoader } from 'https://cdn.skypack.dev/three/examples/jsm/loaders/FBXLoader.js';

    // 1) Load songs data
    import songs from './songs_data.js';

    // Populate song list
    const select = document.getElementById('song-select');
    songs.forEach((song, idx) => {
      const opt = document.createElement('option');
      opt.value = song.path;
      opt.textContent = song.title;
      select.appendChild(opt);
    });

    // 2) Play button logic
    const audio = document.getElementById('audio');
    document.getElementById('play-btn').addEventListener('click', () => {
      audio.src = select.value;
      audio.play();
    });

    // 3) Three.js scene
    let scene, camera, renderer, controls;
    let avatar;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / 600, 0.1, 1000);
      camera.position.set(0, 150, 300);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, 600);
      document.getElementById('3d-container').appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444);
      light.position.set(0, 200, 0);
      scene.add(light);

      const loader = new FBXLoader();
      loader.load('./models/Hip Hop Dancing.fbx', (object) => {
        avatar = object;
        avatar.scale.set(0.1, 0.1, 0.1);
        scene.add(avatar);
      });

      controls = new OrbitControls(camera, renderer.domElement);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / 600;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, 600);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (avatar) avatar.rotation.y += 0.005; // viegla rotācija demonstrācijai
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
